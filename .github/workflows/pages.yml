name: Publish SCAD Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build live registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: npm run build

      - name: Validate generated registry
        run: npm run validate -- --registry dist/registry.json

      - name: Build static website
        run: npm run site:build

      - name: Install browser validation tools
        run: |
          npm install --prefix .cache/pages-browser --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.61.1
          node .cache/pages-browser/node_modules/playwright/cli.js install --with-deps chromium

      - name: Validate published website in Chromium
        run: node --test test/pages.browser.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-website-screenshots
          path: registry-*.png
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
