name: Publish SCAD Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build live registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: npm run build

      - name: Validate generated registry
        run: npm run validate -- --registry dist/registry.json

      - name: Build static website
        run: npm run site:build

      - name: Install browser validation tools
        run: |
          npm install --prefix .cache/pages-browser --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.61.1
          node .cache/pages-browser/node_modules/playwright/cli.js install --with-deps chromium

      - name: Validate published website in Chromium
        run: node --test test/pages.browser.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-website-screenshots
          path: registry-*.png
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # Upload finalization can precede artifact-list visibility. Gate deployment
      # on this run's exact artifact, not just any artifact with the same name.
      - name: Wait for Pages artifact availability
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return a valid artifact ID."
            exit 1
          fi

          for attempt in {1..12}; do
            if artifacts=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name=github-pages -f per_page=100) &&
              jq -e --arg id "$ARTIFACT_ID" '
                [.artifacts[] | select(.name == "github-pages" and .expired == false)]
                | length == 1 and (.[0].id | tostring) == $id
              ' <<< "$artifacts" > /dev/null; then
              echo "Pages artifact $ARTIFACT_ID is visible (attempt $attempt/12)."
              # deploy-pages uses a separate internal artifact listing service.
              sleep 5
              exit 0
            fi

            echo "Pages artifact $ARTIFACT_ID is not ready (attempt $attempt/12)."
            if (( attempt < 12 )); then sleep 5; fi
          done

          echo "::error::Pages artifact $ARTIFACT_ID did not become uniquely visible in this workflow run."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
